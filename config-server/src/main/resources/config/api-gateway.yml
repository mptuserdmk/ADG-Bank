server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:adg-quantum-bank-jwt-secret-key-super-secure-32b-min!}

spring:
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://127.0.0.1:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
      routes:
        # User Service Routes
        - id: user-service-route
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
          filters:
            - AuthenticationFilter
            - name: CircuitBreaker
              args:
                name: gatewayCircuitBreaker
                fallbackUri: forward:/fallback/users

        # Account Service Routes
        - id: account-service-route
          uri: lb://account-service
          predicates:
            - Path=/api/accounts/**
          filters:
            - AuthenticationFilter
            - name: CircuitBreaker
              args:
                name: gatewayCircuitBreaker
                fallbackUri: forward:/fallback/accounts

        # Transaction Service Routes
        - id: transaction-service-route
          uri: lb://transaction-service
          predicates:
            - Path=/api/transactions/**
          filters:
            - AuthenticationFilter
            - name: CircuitBreaker
              args:
                name: gatewayCircuitBreaker
                fallbackUri: forward:/fallback/transactions

        # PQC Vault Service Routes
        - id: pqc-vault-service-route
          uri: lb://pqc-vault-service
          predicates:
            - Path=/api/v1/vault/**
          filters:
            - AuthenticationFilter
            - name: CircuitBreaker
              args:
                name: gatewayCircuitBreaker
                fallbackUri: forward:/fallback/vault

        # Market Rate Service Routes
        - id: market-rate-service-route
          uri: lb://market-rate-service
          predicates:
            - Path=/api/v1/rates/**
          filters:
            - name: CircuitBreaker
              args:
                name: gatewayCircuitBreaker
                fallbackUri: forward:/fallback/rates

        # Swagger API Docs aggregation routes
        - id: user-docs-route
          uri: lb://user-service
          predicates:
            - Path=/v3/api-docs/users
          filters:
            - SetPath=/v3/api-docs

        - id: pqc-vault-docs-route
          uri: lb://pqc-vault-service
          predicates:
            - Path=/v3/api-docs/vault
          filters:
            - SetPath=/v3/api-docs

        - id: market-rate-docs-route
          uri: lb://market-rate-service
          predicates:
            - Path=/v3/api-docs/rates
          filters:
            - SetPath=/v3/api-docs

        - id: account-docs-route
          uri: lb://account-service
          predicates:
            - Path=/v3/api-docs/accounts
          filters:
            - SetPath=/v3/api-docs

        - id: transaction-docs-route
          uri: lb://transaction-service
          predicates:
            - Path=/v3/api-docs/transactions
          filters:
            - SetPath=/v3/api-docs

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Users Service
        url: /v3/api-docs/users
      - name: Accounts Service
        url: /v3/api-docs/accounts
      - name: Transactions Service
        url: /v3/api-docs/transactions
      - name: PQC Vault Service
        url: /v3/api-docs/vault
      - name: Market Rate Service
        url: /v3/api-docs/rates

